<svg xmlns="http://www.w3.org/2000/svg" width="840" height="196" viewBox="0 0 840 196" role="img" aria-label="Entender, Prototipar, Construir, Publicar">
<title>Entender, Prototipar, Construir, Publicar</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}
.ln{stroke-dasharray:100;stroke-dashoffset:100;animation:ln 1.4s ease forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.emo{font:22px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ct{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.cs{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.cp{font:700 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.3px;fill:#E6E6E6}
.cn{font:400 50px Georgia,'Times New Roman',serif;fill:url(#g)}
.cl{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFCFCF}
.cf{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8A8A8A}
.nn{font:400 46px Georgia,'Times New Roman',serif;fill:url(#g)}
.nl{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFCFCF}
.mk{font:400 20px Georgia,'Times New Roman',serif;fill:#E6E6E6}
.mt{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.ms{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.pt{font:700 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.ps{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.at{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.as{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.ap{font:700 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.2px;fill:#E6E6E6}
.al{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFCFCF}
@keyframes md0{0%,0%{fill:#141414;stroke:#3A3A3A}3%,90%{fill:#262626;stroke:#E6E6E6}100%{fill:#141414;stroke:#3A3A3A}}.md0{animation:md0 9s ease infinite}@keyframes md1{0%,24%{fill:#141414;stroke:#3A3A3A}28%,90%{fill:#262626;stroke:#E6E6E6}100%{fill:#141414;stroke:#3A3A3A}}.md1{animation:md1 9s ease infinite}@keyframes md2{0%,49%{fill:#141414;stroke:#3A3A3A}53%,90%{fill:#262626;stroke:#E6E6E6}100%{fill:#141414;stroke:#3A3A3A}}.md2{animation:md2 9s ease infinite}@keyframes md3{0%,74%{fill:#141414;stroke:#3A3A3A}78%,90%{fill:#262626;stroke:#E6E6E6}100%{fill:#141414;stroke:#3A3A3A}}.md3{animation:md3 9s ease infinite}.trilho{stroke-dasharray:100;stroke-dashoffset:100;animation:trilho 9s ease-in-out infinite}@keyframes trilho{0%{stroke-dashoffset:100;opacity:1}75%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.ponto{animation:ponto 9s ease-in-out infinite}@keyframes ponto{0%{transform:translateX(0);opacity:1}75%{transform:translateX(630.0px);opacity:1}92%{opacity:0}100%{transform:translateX(0);opacity:0}}</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8A8A8A"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="838" height="194" rx="18" fill="#141414" stroke="#2A2A2A"/><clipPath id="cd"><rect x="1" y="1" width="838" height="194" rx="18"/></clipPath><g clip-path="url(#cd)"><g class="shine"><rect x="0" y="-20" width="150" height="236" fill="url(#sh)" transform="skewX(-18)"/></g></g><rect class="run" x="1" y="1" width="838" height="194" rx="18" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/>
<line x1="105.0" y1="62" x2="735.0" y2="62" stroke="#2A2A2A" stroke-width="2"/>
<line class="trilho" x1="105.0" y1="62" x2="735.0" y2="62" stroke="#E6E6E6" stroke-width="2.4" pathLength="100"/>
<circle class="md0" cx="105.0" cy="62" r="22" fill="#141414" stroke="#3A3A3A" stroke-width="1.6"/><text class="mk" x="105.0" y="69" text-anchor="middle">1</text>
<g class="up" style="animation-delay:0.15s"><text class="mt" x="105.0" y="120" text-anchor="middle">Entender</text><text class="ms" x="105.0" y="143" text-anchor="middle">o processo real,</text><text class="ms" x="105.0" y="161" text-anchor="middle">não o ideal</text></g>
<circle class="md1" cx="315.0" cy="62" r="22" fill="#141414" stroke="#3A3A3A" stroke-width="1.6"/><text class="mk" x="315.0" y="69" text-anchor="middle">2</text>
<g class="up" style="animation-delay:0.30s"><text class="mt" x="315.0" y="120" text-anchor="middle">Prototipar</text><text class="ms" x="315.0" y="143" text-anchor="middle">tela clicável</text><text class="ms" x="315.0" y="161" text-anchor="middle">antes do banco</text></g>
<circle class="md2" cx="525.0" cy="62" r="22" fill="#141414" stroke="#3A3A3A" stroke-width="1.6"/><text class="mk" x="525.0" y="69" text-anchor="middle">3</text>
<g class="up" style="animation-delay:0.45s"><text class="mt" x="525.0" y="120" text-anchor="middle">Construir</text><text class="ms" x="525.0" y="143" text-anchor="middle">em etapas pequenas,</text><text class="ms" x="525.0" y="161" text-anchor="middle">com teste</text></g>
<circle class="md3" cx="735.0" cy="62" r="22" fill="#141414" stroke="#3A3A3A" stroke-width="1.6"/><text class="mk" x="735.0" y="69" text-anchor="middle">4</text>
<g class="up" style="animation-delay:0.60s"><text class="mt" x="735.0" y="120" text-anchor="middle">Publicar</text><text class="ms" x="735.0" y="143" text-anchor="middle">no ar, com gente</text><text class="ms" x="735.0" y="161" text-anchor="middle">usando de verdade</text></g>
<circle class="ponto" cx="105.0" cy="62" r="5" fill="#FFFFFF"/>
</svg>
